<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="500" viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="swooshGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a18"/>
      <stop offset="50%" stop-color="#ffd200"/>
      <stop offset="100%" stop-color="#3d83f6"/>
    </linearGradient>
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a18"/>
      <stop offset="100%" stop-color="#3d83f6"/>
    </linearGradient>
  </defs>

  <!-- Swoosh shape -->
  <path d="M150 350 Q 400 50 750 200 L 700 250 Q 400 150 200 380 Z" 
        fill="url(#swooshGradient)" opacity="0.95"/>

  <!-- Circular head element -->
  <circle cx="760" cy="180" r="60" fill="url(#circleGradient)" />

  <!-- Spinr text -->
  <text x="850" y="300" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="220" 
        font-weight="700" 
        fill="#3d83f6"
        letter-spacing="2">
    spinr
  </text>
</svg>
